<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1053px;height:342px;background:#FFFFFF;" width="1053px" height="342px" viewBox="0 0 1053 342" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="38"><text x="274.415" y="22.995" fill="#000" font-size="14" textLength="497.171" font-weight="700">Étape 03 : MLD, le lien N à N devient la table pizza_ingredients</text></g><!--class pizzas--><g class="entity" data-qualified-name="pizzas" id="ent0001" data-source-line="42"><rect x="6" y="49.297" width="254.43" height="123.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="111.542" y="67.292" fill="#000" font-size="14" textLength="43.347">pizzas</text><line x1="7" y1="75.594" x2="259.43" y2="75.594" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="17" cy="89.242" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="92.589" fill="#000" font-size="14" textLength="127.019">id : INTEGER «PK»</text><line x1="7" y1="99.891" x2="259.43" y2="99.891" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="17" cy="113.539" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="116.886" fill="#000" font-size="14" textLength="228.43">name : TEXT «UNIQUE NOCASE»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="17" cy="129.836" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="133.183" fill="#000" font-size="14" textLength="199.89">description : TEXT (défaut '')</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="17" cy="146.133" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="26" y="149.479" fill="#000" font-size="14" textLength="175.896">price : REAL (price >= 0)</text><text x="26" y="165.776" fill="#000" font-size="14" textLength="190.374">imageUrl : TEXT (facultatif)</text></g><!--class composition--><g class="entity" data-qualified-name="composition" id="ent0002" data-source-line="51"><rect x="421.5" y="73.797" width="251.162" height="74.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="486.022" y="91.792" fill="#000" font-size="14" textLength="122.117">pizza_ingredients</text><line x1="422.5" y1="100.094" x2="671.662" y2="100.094" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="432.5" cy="113.742" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="441.5" y="117.089" fill="#000" font-size="14" textLength="189.444">pizzaId : INTEGER «PK, FK»</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="432.5" cy="130.039" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="441.5" y="133.386" fill="#000" font-size="14" textLength="225.162">ingredientId : INTEGER «PK, FK»</text><line x1="422.5" y1="140.688" x2="671.662" y2="140.688" style="stroke:#181818;stroke-width:0.5;"/></g><!--class ingredients--><g class="entity" data-qualified-name="ingredients" id="ent0003" data-source-line="56"><rect x="835" y="65.797" width="201.896" height="91.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="896.416" y="83.792" fill="#000" font-size="14" textLength="79.064">ingredients</text><line x1="836" y1="92.094" x2="1035.896" y2="92.094" style="stroke:#181818;stroke-width:0.5;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="846" cy="105.742" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="855" y="109.089" fill="#000" font-size="14" textLength="127.019">id : INTEGER «PK»</text><line x1="836" y1="116.391" x2="1035.896" y2="116.391" style="stroke:#181818;stroke-width:1;"/><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="846" cy="130.039" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="855" y="133.386" fill="#000" font-size="14" textLength="88.86">name : TEXT</text><g data-visibility-modifier="IE_MANDATORY"><ellipse cx="846" cy="146.336" rx="3" ry="3" fill="#000" style="stroke:#000;stroke-width:1;"/></g><text x="855" y="149.683" fill="#000" font-size="14" textLength="175.896">price : REAL (price >= 0)</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="67"><path d="M303,210.297 L303,326.227 A0,0 0 0 0 303,326.227 L790.629,326.227 A0,0 0 0 0 790.629,326.227 L790.629,220.297 L780.629,210.297 L551,210.297 L547,149.03 L543,210.297 L303,210.297 A0,0 0 0 0 303,210.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M780.629,210.297 L780.629,220.297 L790.629,220.297 L780.629,210.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><ellipse cx="314.5" cy="222.93" rx="2.5" ry="2.5" fill="#000"/><text x="321" y="227.364" fill="#000" font-size="13" textLength="420.862">= obligatoire (NOT NULL). PK = clé primaire, FK = clé étrangère.</text><text x="309" y="242.497" fill="#000" font-size="13" textLength="397.217">Clé primaire composée (pizzaId, ingredientId) : un ingrédient</text><text x="309" y="257.629" fill="#000" font-size="13" textLength="285.283">ne figure qu'une fois dans une même pizza.</text><text x="309" y="272.762" fill="#000" font-size="13" textLength="421.789">pizzaId -> pizzas.id : supprimer une pizza efface sa composition.</text><text x="309" y="287.895" fill="#000" font-size="13" textLength="466.629">ingredientId -> ingredients.id : un ingrédient utilisé ne se supprime pas</text><text x="309" y="303.028" fill="#000" font-size="13" textLength="302.859">(l'API répond 409 avant que SQLite ne refuse).</text><text x="309" y="318.161" fill="#000" font-size="13" textLength="371.147">« Au moins un ingrédient » : règle vérifiée par le service.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk4" data-link-type="crowfoot"><line x1="264.027" y1="115.297" x2="264.027" y2="107.297" style="stroke:#181818;stroke-width:1;"/><line x1="267.027" y1="115.297" x2="267.027" y2="107.297" style="stroke:#181818;stroke-width:1;"/><line x1="268.027" y1="111.297" x2="260.027" y2="111.297" style="stroke:#181818;stroke-width:1;"/><line x1="413.281" y1="111.297" x2="421.281" y2="105.297" style="stroke:#181818;stroke-width:1;"/><line x1="413.281" y1="111.297" x2="421.281" y2="117.297" style="stroke:#181818;stroke-width:1;"/><line x1="413.281" y1="111.297" x2="421.281" y2="111.297" style="stroke:#181818;stroke-width:1;"/><line x1="411.281" y1="107.297" x2="411.281" y2="115.297" style="stroke:#181818;stroke-width:1;"/><path d="M268.027,111.297 C319.249,111.297 362.192,111.297 413.281,111.297" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="270.75" y="103.364" fill="#000" font-size="13" textLength="140.474">ON DELETE CASCADE</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-link-type="crowfoot"><line x1="680.76" y1="111.297" x2="672.76" y2="117.297" style="stroke:#181818;stroke-width:1;"/><line x1="680.76" y1="111.297" x2="672.76" y2="105.297" style="stroke:#181818;stroke-width:1;"/><line x1="680.76" y1="111.297" x2="672.76" y2="111.297" style="stroke:#181818;stroke-width:1;"/><ellipse cx="686.76" cy="111.297" rx="4" ry="4" fill="none" style="stroke:#181818;stroke-width:1;"/><line x1="830.97" y1="107.297" x2="830.97" y2="115.297" style="stroke:#181818;stroke-width:1;"/><line x1="827.97" y1="107.297" x2="827.97" y2="115.297" style="stroke:#181818;stroke-width:1;"/><line x1="826.97" y1="111.297" x2="834.97" y2="111.297" style="stroke:#181818;stroke-width:1;"/><path d="M690.76,111.297 C743.257,111.297 777.422,111.297 826.97,111.297" style="stroke:#181818;stroke-width:1;" fill="none"/><text x="683.25" y="103.364" fill="#000" font-size="13" textLength=