<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:567px;height:303px;background:#FFFFFF;" width="567px" height="303px" viewBox="0 0 567 303" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="47.698" y="22.995" fill="#000" font-size="14" textLength="464.604" font-weight="700">Étape 03 : MCD, une pizza contient des ingrédients (N à N)</text></g><!--class PIZZA--><g class="entity" data-qualified-name="PIZZA" id="ent0001" data-source-line="8"><rect x="6" y="49.297" width="246.65" height="115.781" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="108.66" y="67.292" fill="#000" font-size="14" textLength="41.33">PIZZA</text><line x1="7" y1="75.594" x2="251.65" y2="75.594" style="stroke:#181818;stroke-width:0.5;"/><text x="12" y="92.589" fill="#000" font-size="14" textLength="12.776" text-decoration="underline">id</text><text x="29.227" y="92.589" fill="#000" font-size="14" textLength="82.325">(identifiant)</text><text x="12" y="108.886" fill="#000" font-size="14" textLength="234.65">nom (unique, majuscules ou non)</text><text x="12" y="125.183" fill="#000" font-size="14" textLength="77.841">description</text><text x="12" y="141.479" fill="#000" font-size="14" textLength="118.856">prix (saisi, >= 0)</text><text x="12" y="157.776" fill="#000" font-size="14" textLength="133.294">image (facultative)</text></g><!--class INGREDIENT--><g class="entity" data-qualified-name="INGREDIENT" id="ent0002" data-source-line="16"><rect x="376.5" y="65.797" width="111.552" height="83.188" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="388.875" y="83.792" fill="#000" font-size="14" textLength="86.803">INGRÉDIENT</text><line x1="377.5" y1="92.094" x2="487.052" y2="92.094" style="stroke:#181818;stroke-width:0.5;"/><text x="382.5" y="109.089" fill="#000" font-size="14" textLength="12.776" text-decoration="underline">id</text><text x="399.727" y="109.089" fill="#000" font-size="14" textLength="82.325">(identifiant)</text><text x="382.5" y="125.386" fill="#000" font-size="14" textLength="31.076">nom</text><text x="382.5" y="141.683" fill="#000" font-size="14" textLength="79.01">prix (>= 0)</text></g><!--entity CONTIENT--><g class="entity" data-qualified-name="CONTIENT" id="ent0003" data-source-line="22"><ellipse cx="314.652" cy="107.321" rx="43.652" ry="14.524" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="285.907" y="111.969" fill="#000" font-size="14" textLength="57.49">contient</text></g><g class="entity" data-qualified-name="GMN6" id="ent0007" data-source-line="28"><path d="M78,201.297 L78,286.961 A0,0 0 0 0 78,286.961 L551.125,286.961 A0,0 0 0 0 551.125,286.961 L551.125,211.297 L541.125,201.297 L318.5,201.297 L314.5,121.984 L310.5,201.297 L78,201.297 A0,0 0 0 0 78,201.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M541.125,201.297 L541.125,211.297 L551.125,211.297 L541.125,201.297" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="84" y="218.364" fill="#000" font-size="13" textLength="418.526">Cardinalités (Merise) : écrites près de l'entité qu'elles comptent.</text><text x="84" y="233.497" fill="#000" font-size="13" textLength="408.999">1,N près de PIZZA : une pizza contient au moins un ingrédient.</text><text x="84" y="248.629" fill="#000" font-size="13" textLength="452.125">0,N près d'INGRÉDIENT : un ingrédient peut n'être dans aucune pizza</text><text x="84" y="263.762" fill="#000" font-size="13" textLength="271.146">(on crée les ingrédients avant les pizzas).</text><text x="84" y="278.895" fill="#000" font-size="13" textLength="328.713">Les deux maximums valent N : c'est un lien N à N.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk4" data-link-type="a